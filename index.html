<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mini Counter" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <title>Mini Counter PWA</title>
  </head>
  <body>
    <main class="app">
      <h1>Mini Counter</h1>
      <p class="description">iOS Safari対応の最小PWAサンプル</p>
      <p class="counter" aria-live="polite">0</p>
      <button id="incrementButton" type="button">カウントアップ</button>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
